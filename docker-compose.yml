# PostgreSQL local pour le développement et les tests.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: r365
      POSTGRES_PASSWORD: r365
      POSTGRES_DB: r365
    ports: ["5432:5432"]
    volumes:
      - r365-data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
volumes:
  r365-data:
