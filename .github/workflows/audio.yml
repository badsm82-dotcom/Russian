name: Produire les fichiers audio

# Le réseau de la session de développement ne joint ni Wikimedia ni les modèles Silero ; un runner GitHub, si.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu && pip install --quiet soundfile numpy omegaconf
      - name: Liste des textes à sonoriser
        run: npx tsx scripts/audio-texts.ts > audio-texts.json
      - name: Lingua Libre + Silero
        run: python3 scripts/collect_audio.py audio-texts.json
      - name: Enregistrer les fichiers dans la branche
        run: |
          git config user.name "russian365-audio-bot"
          git config user.email "russian365-audio-bot@users.noreply.github.com"
          git add apps/web/public/audio
          if git diff --cached --quiet; then echo "Rien de nouveau."; exit 0; fi
          git commit -m "Audio : fichiers générés (Lingua Libre + Silero)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
